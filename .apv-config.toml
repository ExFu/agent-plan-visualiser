# .apv-config.toml — committed project configuration for agent-plan-visualiser.
# Lives at the repo root (it names the data dir, so it cannot live inside it).
# Parsed with tomllib (stdlib, Python >= 3.11) or apvlib's strict minimal
# fallback on older pythons. Unknown keys are tolerated by design — this file
# accrues future config. See planning/T3-integrity-composite.md §2.3.

[gate]
# Check ids the integrity composite (scripts/gate-composite.py) enforces.
# blocking = corruption of the record (exit 1); warn = advisory, printed, never failing.
# Moving an id between the two lists changes enforcement without code edits.
blocking = ["schema", "referential", "sealed-tail", "implementation-on-draft", "resurrection-without-reopen", "fulcrum-without-decision"]
warn = ["drift", "orphans", "stalled", "long-blockers", "pending-ceremony", "deferred-verification", "attribution-drift"]

[storage]
# Middle layer of the data-dir resolution order: APV_DATA_DIR env var -> this
# -> default (.apv/). This repo's data dir keeps its pre-rename name — the
# log's history lives there and the pin makes the rename a non-event for it.
data_dir = ".agent-plan-tracker"
