<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agent-plan-tracker — project state</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>agent-plan-tracker — project state</h1>
<div class="meta" id="meta">Loading…</div>
<div class="toolbar">
  <button id="btn-board" class="active">Entity state board</button>
  <button id="btn-tree">Plan hierarchy tree</button>
  <button id="btn-flow">Workstreams flow</button>
</div>
<div id="content"></div>
<!--
  marked.js (markdown renderer) loaded from CDN. Used only by the
  Workstreams-flow view to render plan files in the right sidebar.
  Swap-out trigger: if a more capable renderer is needed (e.g. mermaid
  diagrams in plan files), evaluate alternatives. Pure-vanilla fallback
  exists (raw <pre>) if CDN is unavailable.
-->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
